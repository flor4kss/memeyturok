services:
  - type: web
    name: telegram-meme-userbot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python userbot.py"
    envVars:
      - key: SESSION_STRING
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 8080
